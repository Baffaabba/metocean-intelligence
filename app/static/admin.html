<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — MetOcean Intelligence</title>
  <link rel="icon" type="image/png" href="/UTP-Full-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f8fafc;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --border-focus: #0ea5e9;
      --text:         #0f172a;
      --muted:        #64748b;
      --accent:       #0ea5e9;
      --accent-dk:    #0284c7;
      --accent-lt:    rgba(14,165,233,0.08);
      --danger:       #ef4444;
      --warn:         #f59e0b;
      --success:      #10b981;
      --mono:         'IBM Plex Mono', monospace;
      --sans:         'IBM Plex Sans', sans-serif;
      --radius:       10px;
      --shadow:       0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(248,250,252,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      min-height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem;
    }
    .logo-block { display: flex; flex-direction: column; gap: 0.1rem; }
    .logo {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
    }
    .logo span { color: var(--accent); }
    .logo-sub {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--muted);
      opacity: 0.75;
    }
    .header-status {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .header-link {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    main {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 800px) {
      .grid-2col { grid-template-columns: 1fr; }
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem;
      margin-bottom: 1.25rem;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.4s ease forwards;
    }
    .section:nth-child(1) { animation-delay: 0.05s; }
    .section:nth-child(2) { animation-delay: 0.12s; }
    .section:nth-child(3) { animation-delay: 0.19s; }

    .section-header {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .section-num {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
    }
    .section-title {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    /* ── Fields / buttons ─────────────────────────────────────────────────── */
    .field { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="email"] {
      width: 100%;
      height: 40px;
      padding: 0 0.85rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--sans);
      font-size: 0.875rem;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    .btn-primary {
      width: 100%; height: 42px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 7px;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      margin-top: 1.5rem;
    }
    .btn-primary:hover {
      background: var(--accent-dk);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(14,165,233,0.3);
    }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }

    button.secondary, a.secondary {
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    button.secondary:hover, a.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    button.danger {
      color: var(--danger);
      border-color: rgba(239,68,68,0.35);
    }
    button.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(239,68,68,0.06);
    }

    .action-buttons {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    /* ── Tables ───────────────────────────────────────────────────────────── */
    .table-container {
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead { background: var(--bg); position: sticky; top: 0; }
    th {
      padding: 0.7rem 0.85rem;
      text-align: left;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    tr:hover td { background: var(--accent-lt); }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 500;
      font-family: var(--mono);
    }
    .status-accepted { background: rgba(16,185,129,0.12); color: #047857; }
    .status-pending   { background: rgba(245,158,11,0.14); color: #b45309; }
    .status-admin     { background: var(--accent-lt); color: var(--accent-dk); }

    /* ── Alerts ───────────────────────────────────────────────────────────── */
    .alert {
      padding: 0.8rem 1rem;
      border-radius: 7px;
      margin-bottom: 1.25rem;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .alert-success { background: rgba(16,185,129,0.1); color: #047857; border: 1px solid rgba(16,185,129,0.3); }
    .alert-error   { background: rgba(239,68,68,0.1); color: #dc2626; border: 1px solid rgba(239,68,68,0.3); }
    .alert-info    { background: var(--accent-lt); color: var(--accent-dk); border: 1px solid rgba(14,165,233,0.3); }

    /* ── Loading ──────────────────────────────────────────────────────────── */
    .loading { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.6rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:0.75rem;">
    <img src="/UTP-Full-removebg-preview.png" alt="UTP" style="height:32px;opacity:0.9;">
    <div class="logo-block">
      <p class="logo"><span>MetOcean</span> Intelligence Platform</p>
      <p class="logo-sub">Admin Dashboard — Manage Users &amp; Invitations</p>
    </div>
  </div>
  <div class="header-status">
    <a class="header-link" href="/forecast">Forecast</a>
    <a class="header-link" href="#" onclick="logout(); return false;">Logout</a>
  </div>
</header>

<main>
  <div class="grid-2col">
    <!-- Invite New User Section -->
    <section class="section">
      <div class="section-header">
        <span class="section-num">01</span>
        <span class="section-title">Send Invitation</span>
      </div>
      <div id="inviteAlert"></div>
      <form onsubmit="inviteUser(event)">
        <div class="field">
          <label for="inviteEmail">Email Address</label>
          <input type="email" id="inviteEmail" placeholder="newuser@example.com" required>
        </div>
        <button type="submit" class="btn-primary">Send Invitation</button>
      </form>
    </section>

    <!-- Registered Users Section -->
    <section class="section">
      <div class="section-header">
        <span class="section-num">02</span>
        <span class="section-title">Registered Users</span>
      </div>
      <div id="usersContainer" class="loading">
        <div class="spinner"></div>
        Loading users…
      </div>
    </section>
  </div>

  <!-- Pending Invites Section -->
  <section class="section">
    <div class="section-header">
      <span class="section-num">03</span>
      <span class="section-title">Pending Invitations</span>
    </div>
    <div id="invitesContainer" class="loading">
      <div class="spinner"></div>
      Loading invitations…
    </div>
  </section>
</main>

<script>
    const TOKEN_KEY = 'metocean_token';  // Match login.html and forecast.html

    // Build API URL based on environment
    // For localhost (dev), use direct connection to port 8000
    // For production (Nginx), use relative /api path
    const apiUrl = path => {
      if (window.location.hostname === 'localhost' && window.location.port === '8000') {
        return 'http://localhost:8000' + path;
      }
      // Production: use relative path (Nginx proxies /api to backend)
      return window.location.protocol + '//' + window.location.host + '/api' + path;
    };

    let token = localStorage.getItem(TOKEN_KEY);

    if (!token) {
        window.location.href = '/login';  // Redirect to login, not forecast
    }


    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadUsers();
        loadInvites();
    });

    // Fetch with auth header
    async function authFetch(url, options = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            ...options.headers,
        };

        const response = await fetch(url, {
            ...options,
            headers,
        });

        if (response.status === 401 || response.status === 403) {
            logout();
            return null;
        }

        return response;
    }

    // Build the accept-invite link for a given token
    function buildAcceptUrl(token) {
        return `${window.location.origin}/accept-invite?token=${token}`;
    }

    // Build a mailto: link with a pre-filled subject/body so the admin can
    // send the invite from their own already-logged-in email client.
    // NOTE: the recipient must stay unencoded before the "?" — only the
    // subject/body query params get encodeURIComponent.
    function buildMailtoUrl(email, token) {
        const acceptUrl = buildAcceptUrl(token);
        const subject = 'Invitation to MetOcean Intelligence Platform';
        const body =
            `Welcome to MetOcean Intelligence Platform!\n\n` +
            `You have been invited to join MetOcean Intelligence Platform.\n\n` +
            `Click the link below to accept the invitation and set your password:\n${acceptUrl}\n\n` +
            `This invitation link will expire in 7 days.\n\n` +
            `Regards,\nThe MetOcean Intelligence Platform Team`;
        return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    // Copy text to the clipboard and briefly confirm on the triggering button.
    // navigator.clipboard requires a secure context (HTTPS or localhost) —
    // it's simply unavailable over plain HTTP, so fall back to the classic
    // hidden-textarea + execCommand approach in that case.
    function copyToClipboard(text, buttonEl) {
        const confirmCopied = () => {
            const original = buttonEl.textContent;
            buttonEl.textContent = 'Copied!';
            setTimeout(() => { buttonEl.textContent = original; }, 1500);
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(confirmCopied).catch(() => fallbackCopy(text, confirmCopied));
        } else {
            fallbackCopy(text, confirmCopied);
        }
    }

    function fallbackCopy(text, onSuccess) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            if (document.execCommand('copy')) {
                onSuccess();
            } else {
                prompt('Copy this link:', text);
            }
        } catch (err) {
            prompt('Copy this link:', text);
        }
        document.body.removeChild(ta);
    }

    // Load registered users
    async function loadUsers() {
        try {
            const response = await authFetch(apiUrl('/admin/users'));
            if (!response) return;

            const users = await response.json();
            const container = document.getElementById('usersContainer');

            if (users.length === 0) {
                container.innerHTML = '<p style="color: var(--muted); font-size: 0.8rem;">No users registered yet.</p>';
                return;
            }

            let html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            users.forEach(user => {
                const joinDate = new Date(user.created_at).toLocaleDateString();
                const adminBadge = user.is_admin ? '<span class="status-badge status-admin">Admin</span>' : '';

                html += `
                    <tr>
                        <td>${user.email}</td>
                        <td>${adminBadge}</td>
                        <td>${joinDate}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="secondary danger" onclick="deleteUser(${user.id}, '${user.email}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        } catch (error) {
            console.error('Error loading users:', error);
            document.getElementById('usersContainer').innerHTML = '<p style="color: var(--danger); font-size: 0.8rem;">Error loading users.</p>';
        }
    }

    // Load pending invitations
    async function loadInvites() {
        try {
            const response = await authFetch(apiUrl('/admin/invites'));
            if (!response) return;

            const invites = await response.json();
            const container = document.getElementById('invitesContainer');

            if (invites.length === 0) {
                container.innerHTML = '<p style="color: var(--muted); font-size: 0.8rem;">No pending invitations.</p>';
                return;
            }

            let html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Sent</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            invites.forEach(invite => {
                const sentDate = new Date(invite.created_at).toLocaleDateString();
                const status = invite.accepted ?
                    '<span class="status-badge status-accepted">Accepted</span>' :
                    '<span class="status-badge status-pending">Pending</span>';

                let actions = '';
                if (!invite.accepted) {
                    const acceptUrl = buildAcceptUrl(invite.token);
                    const mailtoUrl = buildMailtoUrl(invite.email, invite.token);
                    actions = `
                        <a class="secondary" href="${mailtoUrl}">Open in Email App</a>
                        <button type="button" class="secondary" onclick="copyToClipboard('${acceptUrl}', this)">Copy Link</button>
                        <button type="button" class="secondary" onclick="regenerateInvite(${invite.id}, '${invite.email}')">Regenerate Link</button>
                    `;
                }

                html += `
                    <tr>
                        <td>${invite.email}</td>
                        <td>${status}</td>
                        <td>${sentDate}</td>
                        <td>
                            <div class="action-buttons">
                                ${actions}
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        } catch (error) {
            console.error('Error loading invites:', error);
            document.getElementById('invitesContainer').innerHTML = '<p style="color: var(--danger); font-size: 0.8rem;">Error loading invitations.</p>';
        }
    }

    // Send invitation
    async function inviteUser(event) {
        event.preventDefault();

        const email = document.getElementById('inviteEmail').value;
        const alertDiv = document.getElementById('inviteAlert');

        try {
            const response = await authFetch(apiUrl('/admin/invite'), {
                method: 'POST',
                body: JSON.stringify({ email }),
            });

            if (!response) return;

            if (response.ok) {
                const result = await response.json();
                const acceptUrl = buildAcceptUrl(result.token);
                const mailtoUrl = buildMailtoUrl(result.email, result.token);
                alertDiv.innerHTML = `
                    <div class="alert alert-success">
                        ✓ Invitation created for ${result.email} — send it below:
                        <div class="action-buttons" style="margin-top: 8px;">
                            <a class="secondary" href="${mailtoUrl}">Open in Email App</a>
                            <button type="button" class="secondary" onclick="copyToClipboard('${acceptUrl}', this)">Copy Link</button>
                        </div>
                    </div>
                `;
                document.getElementById('inviteEmail').value = '';
                setTimeout(() => loadInvites(), 1000);
            } else {
                const error = await response.json();
                alertDiv.innerHTML = `<div class="alert alert-error">✗ ${error.detail || 'Failed to send invitation'}</div>`;
            }
        } catch (error) {
            console.error('Error sending invitation:', error);
            alertDiv.innerHTML = `<div class="alert alert-error">✗ Error sending invitation</div>`;
        }
    }

    // Regenerate an invitation's link/expiry (no email is sent automatically)
    async function regenerateInvite(inviteId, email) {
        try {
            const response = await authFetch(apiUrl(`/admin/invites/${inviteId}/resend`), {
                method: 'POST',
            });

            if (!response) return;

            if (response.ok) {
                alert(`Invitation link regenerated for ${email}`);
                loadInvites();
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail}`);
            }
        } catch (error) {
            console.error('Error regenerating invitation:', error);
            alert('Error regenerating invitation');
        }
    }

    // Delete user
    async function deleteUser(userId, email) {
        if (!confirm(`Are you sure you want to deactivate ${email}?`)) return;

        try {
            const response = await authFetch(apiUrl(`/admin/users/${userId}`), {
                method: 'DELETE',
            });

            if (!response) return;

            if (response.ok) {
                alert(`User ${email} deactivated`);
                loadUsers();
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail}`);
            }
        } catch (error) {
            console.error('Error deleting user:', error);
            alert('Error deactivating user');
        }
    }

    // Logout
    function logout() {
        localStorage.removeItem(TOKEN_KEY);
        window.location.href = '/forecast';
    }
</script>
</body>
</html>
