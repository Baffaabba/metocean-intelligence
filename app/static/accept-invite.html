<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation - MetOcean Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 16px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #c8e6c9;
            color: #2e7d32;
            border: 1px solid #81c784;
        }

        .alert-error {
            background: #ffcdd2;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .alert-info {
            background: #b3e5fc;
            color: #0277bd;
            border: 1px solid #4fc3f7;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .password-requirements li {
            margin-left: 20px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">MetOcean</div>
            <h1>Create Your Password</h1>
            <p class="subtitle">You've been invited to MetOcean Intelligence Platform</p>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Verifying invitation...</p>
            </div>
        </div>
    </div>

    <script>
        // Build API URL based on environment
        // For localhost (dev), use direct connection to port 8000
        // For production (Nginx), use relative /api path
        const apiUrl = path => {
          if (window.location.hostname === 'localhost' && window.location.port === '8000') {
            return 'http://localhost:8000' + path;
          }
          // Production: use relative path (Nginx proxies /api to backend)
          return window.location.protocol + '//' + window.location.host + '/api' + path;
        };
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                showError('Invalid invitation link. No token provided.');
                return;
            }

            showForm();
        });

        function showForm() {
            document.getElementById('content').innerHTML = `
                <div id="alert"></div>
                <form onsubmit="submitForm(event)">
                    <div class="password-requirements">
                        <strong>Password requirements:</strong>
                        <ul>
                            <li>At least 8 characters long</li>
                            <li>Mix of letters, numbers, and symbols recommended</li>
                        </ul>
                    </div>
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="8">
                    </div>
                    <button type="submit">Create Account & Sign In</button>
                </form>
                <div class="link">
                    <p>Already have an account? <a href="/forecast.html">Login here</a></p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="alert alert-error">${message}</div>
                <div class="link">
                    <p><a href="/login.html">Return to login</a></p>
                </div>
            `;
        }

        function showSuccess(message) {
            document.getElementById('content').innerHTML = `
                <div class="alert alert-success">${message}</div>
                <div class="link">
                    <p><a href="/login.html">Go to login</a></p>
                </div>
            `;
        }

        async function submitForm(event) {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match.', 'error');
                return;
            }

            const button = event.target.querySelector('button');
            button.disabled = true;
            button.textContent = 'Creating account...';

            try {
                const response = await fetch(apiUrl(`/auth/accept-invite/${token}`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password }),
                });

                if (response.ok) {
                    showSuccess('✓ Account created successfully! You can now login with your email and password.');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    const error = await response.json();
                    showError(`✗ ${error.detail || 'Failed to create account'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('✗ An error occurred. Please try again.');
            }
        }

        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alert');
            if (!alertDiv) return;

            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
    </script>
</body>
</html>
