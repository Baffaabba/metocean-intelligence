[project]
name = "metocean-intelligence"
version = "2.0.0"
description = "MetOcean Intelligence Platform — Time Series Forecasting with LLM Integration"
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",    # required for Form/File uploads

    # Database
    "sqlalchemy>=2.0.0",           # ORM for database
    "psycopg2-binary>=2.9.0",      # PostgreSQL adapter

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",  # argon2 for password hashing (no bcrypt version issues)
    "pydantic[email]>=2.0.0",

    # Data / ML
    "pandas>=1.5,<2.0",           # neuralforecast requires pandas<2
    "numpy>=1.24,<2.0",
    "plotly>=5.18.0",
    "datasetsforecast==0.0.8",
    "neuralforecast==0.1.0",
    "pytorch-lightning==1.6.5.post0",
    "hyperopt>=0.2.7",
    "statsforecast>=1.7.0",

    # Email / AWS
    "boto3>=1.26.0",              # AWS SDK for SES email service

    # Env / utils
    "python-dotenv>=1.0.0",
    "fire>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",              # for FastAPI TestClient
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",          # Code coverage reporting
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

# ── torch must be pre-installed separately (see DEPLOYMENT.md) ────────────────
# uv pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cu118
# (or cpu: https://download.pytorch.org/whl/cpu)

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]
