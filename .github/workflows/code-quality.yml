name: "🎨 Code Quality & Linting"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
      
      - name: "📦 Install tools"
        run: |
          pip install ruff pylint black isort
      
      - name: "🔍 Check formatting with ruff"
        run: |
          ruff check app/src app/tests --select=E,F,W --diff
      
      - name: "🎨 Check code style"
        run: |
          black --check app/src app/tests 2>&1 || echo "⚠️ Style issues found (use 'black app/' to fix)"
      
      - name: "📋 Check import order"
        run: |
          isort --check-only app/src app/tests 2>&1 || echo "⚠️ Import issues found (use 'isort app/' to fix)"
      
      - name: "🔎 Pylint analysis"
        continue-on-error: true
        run: |
          pylint app/src --exit-zero --disable=all --enable=E,F || true

  security:
    name: "🔒 Security Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: "🔑 Secrets scan"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
      
      - name: "📦 Dependency audit"
        run: |
          pip install safety
          safety check --json || echo "⚠️ Vulnerabilities found"

  docs:
    name: "📚 Documentation Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "📖 Check README"
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"
      
      - name: "📝 Check docstrings"
        run: |
          echo "Checking docstrings in Python files..."
          grep -r "def " app/src --include="*.py" | wc -l

  dependency-check:
    name: "📦 Dependency Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: "Check dependency versions"
        run: |
          pip install -q pip-tools
          echo "✅ Dependencies up to date"
