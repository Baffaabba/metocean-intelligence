name: "🎨 Code Quality & Linting"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  lint:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
      
      - name: "📦 Install tools"
        run: |
          pip install uv
          uv sync --group test
      
      - name: "🔍 Check formatting with ruff"
        run: |
          uv run ruff check app/src app/tests --diff || true
      
      - name: "🎨 Check code style"
        continue-on-error: true
        run: |
          uv run black --check app/src app/tests || echo "⚠️ Style issues (use 'black app/' to fix)"
      
      - name: "📋 Check import order"
        continue-on-error: true
        run: |
          uv run isort --check-only app/src app/tests || echo "⚠️ Import issues (use 'isort app/' to fix)"
      
      - name: "🔎 Pylint analysis"
        continue-on-error: true
        run: |
          uv run pylint app/src --exit-zero --disable=all --enable=E,F || true

  security:
    name: "🔒 Security Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "🔍 Check for secrets"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  dependency-check:
    name: "📦 Dependency Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: "Check pyproject.toml"
        run: |
          echo "Checking pyproject.toml..."
          if [ -f pyproject.toml ]; then
            echo "✅ pyproject.toml found"
          else
            echo "❌ pyproject.toml missing"
            exit 1
          fi
