name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  APP_DIR: /srv/metocean/app
  BACKUP_DIR: /srv/metocean/backups

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install uv
        run: |
          pip install uv
      
      - name: Install dependencies
        run: |
          uv sync --group test
      
      - name: Lint with ruff
        run: |
          uv run ruff check app/src app/tests || true
      
      - name: Run basic import tests
        run: |
          uv run python -c "from app.src.nf import MODELS; print(f'Models available: {len(MODELS)}')"
          uv run python -c "from app.src.auth import create_access_token; print('Auth module OK')"
          uv run python -c "from app.src.db import init_db; print('Database module OK')"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create backup
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          mkdir -p $BACKUP_DIR
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "Creating backup: $TIMESTAMP"
          
          # Backup current files
          cp $APP_DIR/api.py $BACKUP_DIR/api.py.backup.$TIMESTAMP
          [ -d $APP_DIR/src ] && cp -r $APP_DIR/src $BACKUP_DIR/src.backup.$TIMESTAMP
          [ -f $APP_DIR/.env ] && cp $APP_DIR/.env $BACKUP_DIR/.env.backup.$TIMESTAMP
          
          # Keep only last 5 backups
          ls -t $BACKUP_DIR/api.py.backup.* | tail -n +6 | xargs -r rm
          
          echo "✓ Backup created: $TIMESTAMP"
          EOF
      
      - name: Deploy files
        run: |
          echo "Deploying to ${{ secrets.EC2_HOST }}"
          scp -r -i ~/.ssh/id_rsa app/ ubuntu@${{ secrets.EC2_HOST }}:$APP_DIR/
          scp -i ~/.ssh/id_rsa pyproject.toml ubuntu@${{ secrets.EC2_HOST }}:$APP_DIR/
          echo "✓ Files deployed"
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "Checking deployed files..."
          
          # Verify app directory
          if [ -d $APP_DIR/app ]; then
            COUNT=$(find $APP_DIR/app -name "*.py" | wc -l)
            echo "✓ app/ deployed ($COUNT Python files)"
          else
            echo "❌ app/ not found"
            exit 1
          fi
          
          # Verify pyproject.toml
          if [ -f $APP_DIR/pyproject.toml ]; then
            echo "✓ pyproject.toml deployed"
          else
            echo "❌ pyproject.toml not found"
            exit 1
          fi
          EOF
      
      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "Restarting metocean service..."
          sudo systemctl restart metocean
          
          # Wait for service to start
          sleep 2
          
          # Check status
          if sudo systemctl is-active --quiet metocean; then
            echo "✓ Service restarted successfully"
          else
            echo "❌ Service failed to start"
            sudo journalctl -u metocean -n 20
            exit 1
          fi
          EOF
      
      - name: Health check
        run: |
          echo "Waiting for service to become ready..."
          for i in {1..30}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health 2>/dev/null || echo "000")
            if [ "$RESPONSE" == "200" ]; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "  Attempt $i/30: HTTP $RESPONSE"
            sleep 2
          done
          echo "⚠️ Health check timeout (service may still be starting)"
      
      - name: Run smoke tests
        continue-on-error: true
        run: |
          echo "Running smoke tests..."
          
          # Test /docs endpoint
          DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/docs 2>/dev/null || echo "000")
          if [ "$DOCS_STATUS" == "200" ]; then
            echo "✓ API docs accessible"
          else
            echo "⚠️ API docs returned $DOCS_STATUS"
          fi
