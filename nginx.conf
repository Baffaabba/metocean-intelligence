# /etc/nginx/sites-available/metocean
# Nginx reverse-proxy for MetOcean Intelligence Platform
# Replace YOUR_EC2_PUBLIC_IP with your actual EC2 public IPv4 address

# ── HTTP Redirect to HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS Server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL Certificate Configuration ─────────────────────────────────────────
    # For Let's Encrypt (recommended):
    # sudo certbot certonly --standalone -d your.domain.com
    # Paths will be: /etc/letsencrypt/live/your.domain.com/
    
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    
    # For self-signed certificates (development only):
    # sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #   -keyout /etc/ssl/private/metocean.key \
    #   -out /etc/ssl/certs/metocean.crt
    
    # Uncomment for self-signed (dev only):
    # ssl_certificate     /etc/ssl/certs/metocean.crt;
    # ssl_certificate_key /etc/ssl/private/metocean.key;
    
    # ── SSL Configuration ────────────────────────────────────────────────────
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_ciphers                 HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers   on;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_timeout         10m;
    ssl_session_tickets         off;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /srv/metocean/static;
    index login.html;

    access_log /var/log/nginx/metocean_access.log;
    error_log  /var/log/nginx/metocean_error.log warn;

    # ── Static frontend files ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /login.html;
        add_header Cache-Control "no-cache";
    }

    # ── API proxy → uvicorn ───────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forecast requests can take a while
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;

        # Allow large CSV uploads
        client_max_body_size 50M;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ── FastAPI docs ──────────────────────────────────────────────────────────
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin"  always;
    add_header X-XSS-Protection       "1; mode=block"  always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

}
